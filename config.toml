[paths]
cache_dir = ".video-index"
music_dir = "media/music"
artifacts_dir = "artifacts"

[indexing]
frame_workers = 4
batch_size = 32
candidate_fps = 2.0
target_keyframe_interval_s = 3.0
max_keyframes_per_shot = 5

[scene_grouping]
model = "clip-ViT-B-32"
similarity_threshold = 0.80
max_scene_duration_s = 15.0

[transcription]
provider = "auto"
subtitle_path = "media/videos/Casino.Royale.movie/Subs/5_English.srt"
subtitle_encoding = "utf-8-sig"
whisper_model = "large-v3-turbo"
whisper_device = "auto"
whisper_compute_type = "default"
language = "eng"

[embedding]
provider = "sentence-transformers"
model = "BAAI/bge-small-zh-v1.5"
hashing_dimension = 256

[vlm]
provider = "openai-compatible"
model = "Qwen/Qwen3-VL-8B-Instruct"
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "SILICONFLOW_API_KEY"
workers = 2
timeout_s = 180.0
retries = 3
max_tokens = 1200
max_vlm_frames_per_scene = 8
max_image_dimension = 1024
request_interval_s = 2.0

[llm]
provider = "openai-compatible"
base_url = "https://vyceai.com/v1"
api_key_env = "VYCE_API_KEY"
screenwriter_model = "gpt-5.6-luna"
screenwriter_max_tokens = 4000
scene_tagger_model = "gpt-5.6-luna"
scene_tagger_max_tokens = 1200
story_structure_model = "gpt-5.6-luna"
story_structure_max_tokens = 4000
story_structure_max_scenes_per_chunk = 24
timeout_s = 180.0
retries = 3

[tts]
provider = "edge"
voice = "zh-CN-XiaoxiaoNeural"
rate = 185

[render]
enabled = false
aspect = "landscape"
fps = 30
video_codec = "libx264"

[edit]
target_duration_s = 60.0

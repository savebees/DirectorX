[paths]
cache_dir = ".video-index"
music_dir = "media/music"
artifacts_dir = "artifacts"

[indexing]
frame_workers = 4
batch_size = 32
candidate_fps = 2.0
target_keyframe_interval_s = 3.0
max_keyframes_per_shot = 5

[scene_grouping]
model = "clip-ViT-B-32"
similarity_threshold = 0.80
max_scene_duration_s = 15.0

[transcription]
provider = "auto"
subtitle_path = "media/videos/Casino.Royale.movie/Subs/5_English.srt"
subtitle_encoding = "utf-8-sig"
whisper_model = "large-v3-turbo"
whisper_device = "auto"
whisper_compute_type = "default"
language = "eng"

[embedding]
provider = "sentence-transformers"
model = "BAAI/bge-small-zh-v1.5"
hashing_dimension = 256

[vlm]
provider = "openai-compatible"
model = "Qwen/Qwen3-VL-8B-Instruct"
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "SILICONFLOW_API_KEY"
workers = 2
timeout_s = 180.0
retries = 3
max_tokens = 1200
max_vlm_frames_per_scene = 8
max_image_dimension = 1024
request_interval_s = 2.0
structured_output_mode = "json_object"

[llm]
provider = "openai-compatible"
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "SILICONFLOW_API_KEY"
screenwriter_model = "deepseek-ai/DeepSeek-V3.2"
screenwriter_max_tokens = 4000
scene_tagger_model = "deepseek-ai/DeepSeek-V3.2"
scene_tagger_max_tokens = 1200
story_structure_model = "deepseek-ai/DeepSeek-V3.2"
story_structure_max_tokens = 4000
story_structure_max_scenes_per_chunk = 12
scene_tagger_max_parallel = 2
request_interval_s = 1.0
timeout_s = 180.0
retries = 0
structured_output_mode = "json_object"
screenwriter_fallback_structured_output_mode = "json_object"

[tts]
provider = "edge"
voice = "zh-CN-XiaoxiaoNeural"
rate = 160
language = "zh-CN"

[grounding]
candidate_limit = 4
candidate_padding_s = 1.0
coarse_fps = 1.0
refine_fps = 6.0
refine_margin_s = 2.0
max_coarse_frames = 24
max_refine_frames = 24
max_parallel = 2

[sound]
embedding_model = "laion/larger_clap_music"
device = "cpu"
analysis_window_s = 10.0
analysis_windows_per_track = 3
gain_db = -23.0
duck_under_voice_db = -9.0

[review]
max_frames = 12

[render]
enabled = true
aspect = "landscape"
fps = 30
video_codec = "libx264"

[edit]
target_duration_s = 60.0
min_voice_coverage = 0.65
max_voice_coverage = 0.88
breathing_room_s = 0.35
max_freeze_per_clip_s = 0.3
max_title_duration_s = 8.0
